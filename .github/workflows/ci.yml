name: Extension SDK CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, mbstring, sodium, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install package QA dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run complete package gate
        run: composer check

      - name: Verify production-only installation
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer smoke

      - name: Prove a fresh authoritative archive dependency consumer
        run: php tools/verify-clean-consumer.php

  release-tests:
    name: Release automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify release transitions and repository setup
        run: |
          bash tools/test-release-record.sh
          bash tools/test-release-integrity.sh
          bash tools/test-release-on-record.sh
          bash tools/test-configure-release-repositories.sh
          bash tools/test-release-prerequisites.sh

  release-prerequisites:
    name: Release prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify live default-branch release rules
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash tools/check-release-prerequisites.sh

  package-gate:
    name: Package gate
    if: always()
    needs: [check, release-tests, release-prerequisites]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require package tests and live release prerequisites
        env:
          PACKAGE_RESULT: ${{ needs.check.result }}
          RELEASE_RESULT: ${{ needs.release-tests.result }}
          PREREQUISITE_RESULT: ${{ needs.release-prerequisites.result }}
        run: |
          test "$PACKAGE_RESULT" = success
          test "$RELEASE_RESULT" = success
          test "$PREREQUISITE_RESULT" = success
