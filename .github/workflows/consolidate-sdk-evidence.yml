name: Consolidate SDK evidence branch
on:
  push:
    branches: [codex/extraction-readiness-20260907]
permissions:
  contents: read
jobs:
  remove-preserved-evidence-branch:
    if: github.repository == 'kumwe/extension-sdk' && github.ref == 'refs/heads/codex/extraction-readiness-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify every preserved blob and remove only the redundant evidence branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = kumwe/extension-sdk
          test "$GITHUB_REF" = refs/heads/codex/extraction-readiness-20260907
          expected=f6f886b457a8a1a288d457ed9a6474e95b0f99e6
          endpoint=repos/kumwe/extension-sdk/git/refs/heads/evidence/release-verification-v2
          test "$(gh api "$endpoint" --jq '.object.sha')" = "$expected"
          gh api "repos/kumwe/extension-sdk/git/trees/$expected?recursive=1" > "$RUNNER_TEMP/sdk-evidence-tree.json"
          python3 - "$RUNNER_TEMP/sdk-evidence-tree.json" <<'PY'
          import json, subprocess, sys
          original = json.load(open(sys.argv[1]))
          assert original.get('truncated') is False, 'Original evidence tree is incomplete'
          blobs = {entry['path']: (entry['mode'], entry['sha']) for entry in original['tree'] if entry['type'] == 'blob'}
          assert len(blobs) == 19, 'Expected exactly the reviewed 19 evidence blobs'
          prefix = 'evidence/release-verification-v2/'
          preserved = {}
          tree = subprocess.check_output(['git', 'ls-tree', '-r', 'HEAD', '--', prefix], text=True)
          for line in tree.splitlines():
              metadata, name = line.split('\t', 1)
              mode, kind, sha = metadata.split()
              assert kind == 'blob' and name.startswith(prefix), 'Invalid preserved evidence entry'
              preserved[name[len(prefix):]] = (mode, sha)
          assert preserved == blobs, 'Original evidence bytes or paths were not preserved exactly'
          print('Verified all 19 original blobs unchanged on the SDK readiness branch.')
          PY
          test "$(gh api "$endpoint" --jq '.object.sha')" = "$expected"
          gh api --method DELETE "$endpoint"
          echo 'Removed only evidence/release-verification-v2 after exact preservation verification.'
