name: Release on record

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-on-record
  cancel-in-progress: false

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # v2.35.5
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, filter, json, mbstring, sodium, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Install package QA dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run complete package gate
        run: composer check

      - name: Verify production-only installation
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer smoke

      - name: Verify exported consumer archive
        run: composer archive:verify

  release:
    name: Release the recorded version
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the newest recorded version
        id: record
        shell: bash
        run: |
          set -euo pipefail
          first="$(grep -m 1 -E '^## ' CHANGELOG.md || true)"
          if [ "$first" = "## Unreleased" ] || [ "$first" = "## [Unreleased]" ]; then
            first="$(grep -E '^## ' CHANGELOG.md | sed -n 2p)"
          fi
          if [ -z "$first" ]; then
            echo "::notice::CHANGELOG.md records no release; nothing to publish."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -nE 's/^## \[?([0-9]+\.[0-9]+\.[0-9]+)\]?( .*)?$/\1/p' <<<"$first")"
          if [ -z "$version" ]; then
            echo "::error::Newest changelog heading is not a release record: $first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create or verify the version tag
        if: steps.record.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.record.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          response="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" 2>&1)" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Tag v$VERSION already exists; verifying its target."
          elif grep -q 'HTTP 404' <<<"$response"; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="refs/tags/v$VERSION" \
              --field sha="$GITHUB_SHA" >/dev/null
            echo "Created tag v$VERSION at $GITHUB_SHA."
          else
            echo "$response"
            echo "::error::Could not determine whether tag v$VERSION exists."
            exit 1
          fi

          target="$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha)"
          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "::error::Tag v$VERSION targets $target, not checked commit $GITHUB_SHA."
            exit 1
          fi

      - name: Publish or verify the GitHub release
        if: steps.record.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.record.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          response="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" 2>&1)" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Release v$VERSION already exists; leaving it unchanged."
          elif grep -q 'HTTP 404' <<<"$response"; then
            gh release create "v$VERSION" \
              --verify-tag \
              --title "v$VERSION" \
              --notes "Canonical kumwe/extension-sdk v$VERSION. See CHANGELOG.md for the reviewed release record."
          else
            echo "$response"
            echo "::error::Could not determine whether release v$VERSION exists."
            exit 1
          fi
