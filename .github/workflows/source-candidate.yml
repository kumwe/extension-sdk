name: Native source candidate CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  native-source-candidate:
    name: Native source candidate gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: package
    steps:
      - name: Check out SDK candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: package
          persist-credentials: false
      - name: Check out exact native candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/kumwe-engine
          ref: 7ad5cf913af6feb984fe5b85451104179634df83
          path: native
          persist-credentials: false
      - name: Check out access-control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/access-control
          ref: c2420d1ed03bc39eaf5d8b9f5540580c297e3b57
          path: dependencies/access-control
          persist-credentials: false
      - name: Check out administrator-contract source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/administrator-contract
          ref: 2c8e1c5a39c6591be046b76b0f11f7eded6084bd
          path: dependencies/administrator-contract
          persist-credentials: false
      - name: Check out portal-contract source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/portal-contract
          ref: 6ba19b263e3cf874a4c45e478450ccc3aa9605d6
          path: dependencies/portal-contract
          persist-credentials: false
      - name: Check out business-surface-contract source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/business-surface-contract
          ref: 06c23a90b9fe9826276d1d57faef74729b5a1e38
          path: dependencies/business-surface-contract
          persist-credentials: false
      - name: Check out automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/automation
          ref: 6f09acc6696d11a7ab290e7507d0731bce475549
          path: dependencies/automation
          persist-credentials: false
      - name: Check out integration source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/integration
          ref: ff42d4d52753a3fec338b930f665c4283a9f5805
          path: dependencies/integration
          persist-credentials: false
      - name: Check out canonical-json source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/canonical-json
          ref: e7006a2580a49a1c8ab507b0d7b9c3403b4f9f58
          path: dependencies/canonical-json
          persist-credentials: false
      - name: Check out idempotency source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/idempotency
          ref: 283ddd7d862295078e354ebe7ebfa6e41af1dd94
          path: dependencies/idempotency
          persist-credentials: false
      - name: Check out business-policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/business-policy
          ref: 96c68447a7a7beccbdb5d152e53306595ae0d7a1
          path: dependencies/business-policy
          persist-credentials: false
      - name: Check out record-model source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/record-model
          ref: 8d20cf75ee6ab915102bbf6a17567087971e9dfe
          path: dependencies/record-model
          persist-credentials: false
      - name: Check out record-query source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/record-query
          ref: 18b1f8ca8dce5eb3ca3cb8c4c3a0443599d232d9
          path: dependencies/record-query
          persist-credentials: false
      - name: Check out record-values source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/record-values
          ref: 04a3f5f8094861771682b3ba83536ec8828dc704
          path: dependencies/record-values
          persist-credentials: false
      - name: Check out reporting source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/reporting
          ref: b521b3113bd97afc2de6ab74fcb71a36fe7d0890
          path: dependencies/reporting
          persist-credentials: false
      - name: Check out business-definition source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/business-definition
          ref: 1cb59229f311067e8cfdd773a34e34cfeb501791
          path: dependencies/business-definition
          persist-credentials: false
      - name: Check out sequence source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/sequence
          ref: 142c3e74a7596935ef42c8fa744ca705fd3b4b4f
          path: dependencies/sequence
          persist-credentials: false
      - name: Check out contribution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/contribution
          ref: 2fc75742aa5a7d78418d2f586fa3043271e70082
          path: dependencies/contribution
          persist-credentials: false
      - name: Check out access-context source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/access-context
          ref: 132c3cd7c229ceda4398e19140d1477512c27ebf
          path: dependencies/access-context
          persist-credentials: false
      - name: Check out conversion source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/conversion
          ref: b291f3a31314644fd88150dc9a9e911fe0617fe7
          path: dependencies/conversion
          persist-credentials: false
      - name: Check out localization source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/localization
          ref: 8571ab575b9b9f2dc1b8a25b3c902d9cf44093cb
          path: dependencies/localization
          persist-credentials: false
      - name: Check out producer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/producer
          ref: 65d0a10ce39954738f091ec4b5e2626768053c8d
          path: dependencies/producer
          persist-credentials: false
      - name: Check out computation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kumwe/computation
          ref: 6ac52321c2a5089f52d44e20cfa6374064960e8a
          path: dependencies/computation
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: dom, json, mbstring, sodium, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Build and load pinned native extension
        working-directory: native
        run: |
          test "$(git rev-parse HEAD)" = 7ad5cf913af6feb984fe5b85451104179634df83
          php tools/generate-arginfo.php --check
          php tools/verify-binding.php
          php tools/verify-engine.php
          phpize
          ./configure --enable-kumwe_engine
          make -j2
          php tools/expected-tuple.php > candidate-compatibility.json
          native_ini="$RUNNER_TEMP/kumwe-sdk-native.ini"
          cp "$(php -r 'echo php_ini_loaded_file();')" "$native_ini"
          printf '\nextension=%s/modules/kumwe_engine.so\n' "$PWD" >> "$native_ini"
          echo "PHPRC=$native_ini" >> "$GITHUB_ENV"
          echo "KUMWE_NATIVE_EXPECTED_TUPLE=$PWD/candidate-compatibility.json" >> "$GITHUB_ENV"
      - name: Install explicit source dependency graph
        run: |
          php tools/verify-dependency-selection.php
          php tools/install-source-candidate.php
      - name: Run complete SDK checks with actual native runtime
        run: composer check
      - name: Verify archive and generated project consumers
        run: php tools/verify-clean-consumer.php --scaffold
      - name: Record source candidate scope
        run: |
          cat ../candidate-dependency-evidence.json
          echo 'Source verification only; publication and independent host adoption evidence remain separate.'
